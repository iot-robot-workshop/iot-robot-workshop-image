name: build-image
on:
  push:
    branches: [main, feature/**]
    paths: ["image/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iot-robot-workshop-image:1
            ghcr.io/${{ github.repository_owner }}/iot-robot-workshop-image:latest
